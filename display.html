<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PMTG Hari Sukan Negara 2026 — Attendance QR</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0b1e3a;
      --accent: #ffcc00;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #123063, var(--bg));
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      color: white;
      text-align: center;
      padding: 24px;
    }

    .logos {
      display: flex;
      gap: 24px;
      align-items: center;
      margin-bottom: 12px;
    }

    .logos img {
      height: 64px;
      background: #fff;
      border-radius: 10px;
      padding: 6px;
    }

    h1 {
      font-size: clamp(20px, 3vw, 34px);
      margin: 4px 0 2px;
    }

    h2 {
      font-weight: 400;
      font-size: clamp(14px, 2vw, 18px);
      color: var(--accent);
      margin: 0 0 24px;
    }

    .qr-card {
      background: var(--card);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    #qrcode {
      width: 280px;
      height: 280px;
      margin: 0 auto;
    }

    .status {
      margin-top: 18px;
      font-size: 14px;
      opacity: 0.85;
    }

    .status.error {
      color: #ff6b6b;
    }
  </style>
</head>

<body>

  <div class="logos">
    <img src="LOGOPMTG.png" alt="JPP Politeknik METrO Tasek Gelugor" onerror="this.style.display='none'">
  </div>

  <h1>HARI SUKAN NEGARA PMTG 2026</h1>
  <h2>Scan to mark attendance</h2>

  <div class="qr-card">
    <div id="qrcode"></div>
  </div>

  <div class="status" id="status">Loading...</div>

  <script>
    // ====== CONFIG — edit these lines ======
    const SUPABASE_FUNCTIONS_URL = "https://ryfryacxmrzuslazrtme.supabase.co/functions/v1";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5ZnJ5YWN4bXJ6dXNsYXpydG1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MDg2NjcsImV4cCI6MjEwNjA4NDY2N30.-oIe-b7xwrd-19VPiggvM20RR14mTAQ0gw_Kl990Ko8";
    const CHECKIN_PAGE_URL = "https://ermxxn.github.io/PMTG_Attendance_System/checkin.html";
    const ACTIVE_EVENT_FUNCTION = "super-responder"; // the function that reports who's live
    // ==========================================

    const qrDiv = document.getElementById("qrcode");
    const statusDiv = document.getElementById("status");

    // The QR itself never changes — it's just a fixed link to checkin.html.
    // checkin.html looks up whichever event is live at the moment it's scanned.
    new QRCode(qrDiv, {
      text: CHECKIN_PAGE_URL,
      width: 280,
      height: 280,
      colorDark: "#0b1e3a",
      colorLight: "#ffffff",
    });

    async function refreshStatus() {
      try {
        const res = await fetch(`${SUPABASE_FUNCTIONS_URL}/${ACTIVE_EVENT_FUNCTION}`, {
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "No active event");
        statusDiv.textContent = `Now checking in: ${data.event_name}`;
        statusDiv.classList.remove("error");
      } catch (err) {
        statusDiv.textContent = err.message;
        statusDiv.classList.add("error");
      }
    }

    refreshStatus();
    setInterval(refreshStatus, 30000); // just refreshes the label, not the QR
  </script>
</body>

</html>
